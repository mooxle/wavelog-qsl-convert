# Stationsdaten für das PDF (--pdf). Kopieren nach qsl_station.ini und anpassen.
# qsl_station.ini ist per .gitignore von Git ausgeschlossen.

[station]
name = Max Mustermann
# Anschrift: bis zu drei Zeilen, jeweils eingerückt
address =
    Musterstrasse 12
    12345 Musterstadt
    Germany
# Heimat-Locator: Weicht der Locator eines QSOs davon ab, steht „Portable“ auf der Karte
home_locator = JO40XX
dok = X00
cq_zone = 14
itu_zone = 28
# Name im Gruß „Max, <Rufzeichen>“ (Standard: erstes Wort von name)
greeting = Max

[pdf]
# Seitenlage: 0 = Querformat 140 × 90 mm (Standard); 90 oder 270 = Hochformat 90 × 140 mm
# mit gedrehtem Inhalt, falls der Drucker die Karte nur hochkant richtig verarbeitet
rotate = 0
# Logo, das bei POTA-QSOs gedruckt wird (8-Bit-PNG); leer lassen für kein Logo
logo = assets/pota_logo.png
# Schriften (TrueType). Leer = automatisch: Avenir Next Condensed (macOS), Arial Narrow,
# DejaVu Sans Condensed. Bei .ttc-Dateien den Schnitt mit # angeben, z. B.
# font = /System/Library/Fonts/Avenir Next Condensed.ttc#Avenir Next Condensed Regular
font =
font_bold =
# Optional: Befehl, der mit --drucken nach dem Erzeugen ausgeführt wird; {pdf} = die PDF-Datei.
# Leer lassen, wenn du das PDF selbst druckst. Beispiel für einen AirPrint-Drucker, der sonst
# verkleinert (macOS/Linux, Druckername mit: lpstat -p):
# drucken = lp -d Mein_Drucker -o media=Custom.90x140mm -o print-scaling=none -o InputSlot=by-pass-tray {pdf}
drucken =
