# Beschreibung für LogDeck, eine Mac-Oberfläche für diese Scripts (optional – das Script läuft auch ohne).
# LogDeck baut daraus das Formular; das Script selbst bleibt unverändert nutzbar.
schema = 1

[tool]
name = "QSL-Seriendruck"
name_en = "QSL mail merge"
summary = "Macht aus dem QSL-Export von Wavelog druckfertige QSL-Karten (PDF) und die CSV für den Word-Seriendruck – mit POTA-Parknamen und Umschlag-Adressen von QRZ.com."
summary_en = "Turns Wavelog's QSL export into print-ready QSL cards (PDF) and a CSV for Word mail merge, with POTA park names and envelope addresses from QRZ.com."
icon = "card"
group = "QSL"

[run]
# nutzt den Helfer logdeck.py: Ergebnis-Ansicht statt Terminal
events = true
command = ["python", "qsl_convert.py"]
# Die Ergebnisse landen neben dem Export
cwd = "{input.dir}"

[[param]]
id = "input"
label = "QSL-Export"
label_en = "QSL export"
type = "file"
accept = ["csv", "adi", "adif"]
required = true
help = "CSV oder ADIF aus Wavelog (QSL-Warteschlange)."
help_en = "CSV or ADIF from Wavelog's QSL queue."

[[param]]
id = "aufgabe"
label = "Aufgabe"
label_en = "Task"
type = "choice"
flag = "--aufgabe"
default = "karten"
options = [
  { value = "karten", label = "Karten", label_en = "Cards" },
  { value = "umschlaege", label = "Umschläge für Direct-Karten", label_en = "Envelopes for direct cards" },
]
help = "Karten: CSV und Karten-PDF. Umschläge: Adressen von QRZ.com holen, in einer Tabelle prüfen und korrigieren (wird gemerkt), dann Umschlag-PDF."
help_en = "Cards: CSV and card PDF. Envelopes: fetch addresses from QRZ.com, check and correct them in a table (remembered), then envelope PDF."

[[param]]
id = "pota"
label = "POTA-Parknamen abfragen"
label_en = "Look up POTA park names"
type = "bool"
flag = "--no-pota"
invert = true
default = true

[[param]]
id = "pdf"
label = "Druckfertiges PDF (140 × 90 mm)"
label_en = "Print-ready PDF (140 × 90 mm)"
type = "bool"
flag = "--pdf"
default = true
help = "Eine Karte pro Seite im Layout der Blanko-Vorlage, direkt druckbar ohne Word. Stationsdaten aus qsl_station.ini."
help_en = "One card per page in the blank-card layout, printable without Word. Station data from qsl_station.ini."

[[param]]
id = "karte"
label = "Kartenvorlage"
label_en = "Card template"
type = "choice"
flag = "--karte"
default = "blanko"
options = [
  { value = "blanko", label = "Blanko-Karte (komplette Rückseite)", label_en = "Blank card (full back side)" },
  { value = "vordruck", label = "Vorgedruckte Karte (nur QSO-Daten)", label_en = "Pre-printed card (QSO data only)" },
]
help = "Nur für Karten: leere Karten komplett bedrucken oder nur die Daten auf vorgedruckte Karten."
help_en = "For the PDF: print the whole card on blank stock, or only the data onto pre-printed cards."

[[param]]
id = "drucken"
label = "Nach dem Erzeugen drucken"
label_en = "Print after creating"
type = "bool"
flag = "--drucken"
default = false
help = "Führt den Druckbefehl aus der Stationsdatei aus ([pdf] drucken für Karten, [umschlag] drucken für Umschläge). Ohne Eintrag passiert nichts."
help_en = "Runs the print command from the station file ([pdf] drucken). Does nothing if none is set."

[[param]]
id = "pota_slots"
label = "POTA-Spalten"
label_en = "POTA columns"
type = "number"
flag = "--pota-slots"
placeholder = "4"
min = 1
max = 12
step = 1
advanced = true
help = "Anzahl der Spalten POTA_1 … POTA_N, muss zur Word-Vorlage passen."
help_en = "Number of POTA_1 … POTA_N columns, must match the Word template."

[[param]]
id = "qrz_delay"
label = "Pause zwischen QRZ-Abfragen"
label_en = "Delay between QRZ lookups"
type = "number"
flag = "--qrz-delay"
unit = "s"
placeholder = "1.0"
min = 0
step = 0.5
advanced = true

[env]
QRZ_USERNAME = "qrz.username"
QRZ_PASSWORD = "qrz.password"

[[output]]
label = "Seriendruck-CSV"
label_en = "Mail-merge CSV"
path = "{input.dir}/{input.stem}_seriendruck.csv"

[[output]]
label = "Umschlag-Adressen"
label_en = "Envelope addresses"
path = "{input.dir}/{input.stem}_umschlaege.csv"

[[output]]
label = "QSL-Karten (PDF)"
label_en = "QSL cards (PDF)"
path = "{input.dir}/{input.stem}_karten.pdf"

[[output]]
label = "Umschläge (PDF)"
label_en = "Envelopes (PDF)"
path = "{input.dir}/{input.stem}_umschlaege.pdf"
